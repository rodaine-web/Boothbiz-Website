<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="title desc"><title id="title">Capture enquiries</title><desc id="desc">Illustrative phone showing an event enquiry form. Not a working form.</desc><defs><linearGradient id="wash" x2="1" y2="1"><stop stop-color="#F1EBFF"/><stop offset="1" stop-color="#FAF8F2"/></linearGradient></defs><rect width="640" height="480" rx="32" fill="url(#wash)"/><g><rect x="150" y="26" width="340" height="435" rx="34" fill="#211A30" stroke="none"/><rect x="160" y="36" width="320" height="415" rx="26" fill="#FFF" stroke="none"/><rect x="270" y="45" width="100" height="15" rx="8" fill="#211A30" stroke="none"/><text x="190" y="102" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#201435" font-weight="700">Enquire about your event</text><rect x="190" y="132" width="260" height="44" rx="9" fill="#FCFAFF" stroke="#E7DEF5"/><text x="205" y="160" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#7C728F" font-weight="500">Your name</text><rect x="190" y="192" width="260" height="44" rx="9" fill="#FCFAFF" stroke="#E7DEF5"/><text x="205" y="220" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#7C728F" font-weight="500">Your email</text><rect x="190" y="252" width="260" height="44" rx="9" fill="#FCFAFF" stroke="#E7DEF5"/><text x="205" y="280" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#7C728F" font-weight="500">Event date</text><rect x="190" y="312" width="260" height="44" rx="9" fill="#FCFAFF" stroke="#E7DEF5"/><text x="205" y="340" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#7C728F" font-weight="500">Event type</text><rect x="190" y="378" width="260" height="48" rx="10" fill="#6331C7" stroke="none"/><text x="258" y="408" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#FFF" font-weight="700">Send enquiry</text></g></svg>